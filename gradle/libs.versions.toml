[versions]
adapterRxjava3 = "2.11.0"
agp = "8.9.1"
converterMoshi = "2.9.0"
core = "1.6.1"
kotlin = "2.0.21"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
